<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Studio — POD & Microstock Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            obsidian: '#09090b',
            charcoal: '#121216',
            gold: {
              400: '#fbbf24',
              500: '#f59e0b',
              600: '#d97706',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #09090b;
      color: #f4f4f5;
    }
    .gold-gradient {
      background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
    }
    .gold-text {
      background: linear-gradient(135deg, #fde68a 0%, #f59e0b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .card-surface {
      background: rgba(24, 24, 27, 0.75);
      border: 1px solid rgba(251, 191, 36, 0.15);
      backdrop-filter: blur(12px);
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #09090b; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #d97706; }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-amber-500/30 selection:text-amber-200">

  <!-- Header -->
  <header class="border-b border-zinc-800/80 bg-zinc-950/80 backdrop-blur-md sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl gold-gradient flex items-center justify-center shadow-lg shadow-amber-500/20 text-zinc-950 font-bold text-lg">
          ✦
        </div>
        <div>
          <h1 class="font-bold text-base sm:text-lg tracking-tight gold-text">AI Asset Studio</h1>
          <p class="text-[11px] text-zinc-400 hidden sm:block">Print on Demand & Microstock Generator</p>
        </div>
      </div>

      <!-- API Key Button -->
      <button onclick="toggleApiModal()" id="apiStatusBtn" class="flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs font-medium bg-zinc-900 border border-zinc-700 hover:border-amber-500/50 transition">
        <span id="apiDot" class="w-2 h-2 rounded-full bg-red-500"></span>
        <span id="apiBtnText">Atur API Key</span>
      </button>
    </div>
  </header>

  <!-- Main Workspace -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8 grid grid-cols-1 lg:grid-cols-12 gap-6">
    
    <!-- Left Column: Controls -->
    <div class="lg:col-span-5 space-y-5">
      
      <!-- Category Switcher -->
      <div class="card-surface p-1.5 rounded-2xl grid grid-cols-2 gap-1.5">
        <button type="button" onclick="setCategory('pod')" id="tabPod" class="py-2.5 px-3 rounded-xl text-xs sm:text-sm font-semibold transition flex items-center justify-center gap-2 gold-gradient text-zinc-950 shadow-md">
          <span>👕</span> Print on Demand
        </button>
        <button type="button" onclick="setCategory('microstock')" id="tabMicrostock" class="py-2.5 px-3 rounded-xl text-xs sm:text-sm font-semibold transition flex items-center justify-center gap-2 text-zinc-400 hover:text-white">
          <span>📸</span> Microstock
        </button>
      </div>

      <!-- Prompt Box -->
      <div class="card-surface p-5 rounded-2xl space-y-4">
        <div class="flex items-center justify-between">
          <label class="text-xs font-semibold uppercase tracking-wider text-amber-400" id="categoryBadge">Mode: Desain Kaos & Merch</label>
          <button type="button" onclick="enhancePrompt()" id="enhanceBtn" class="text-xs flex items-center gap-1.5 text-amber-300 hover:text-amber-200 bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 px-2.5 py-1 rounded-lg transition">
            <span>✨</span> Percantik Prompt
          </button>
        </div>

        <div>
          <textarea id="promptInput" rows="4" placeholder="Contoh: Kucing astronot minum kopi gaya retro vector..." class="w-full bg-zinc-900/90 border border-zinc-700/80 focus:border-amber-500 focus:ring-1 focus:ring-amber-500 rounded-xl p-3.5 text-sm text-zinc-100 placeholder-zinc-500 outline-none transition resize-none"></textarea>
          <p class="text-[11px] text-zinc-500 mt-1.5" id="helperTip">Tips: Gunakan bahasa Indonesia atau Inggris. Klik "Percantik Prompt" agar detail lebih tajam.</p>
        </div>

        <!-- Style Presets -->
        <div>
          <label class="block text-xs font-medium text-zinc-400 mb-2">Gaya Visual (Style Preset)</label>
          <select id="styleSelect" class="w-full bg-zinc-900 border border-zinc-700/80 focus:border-amber-500 rounded-xl px-3.5 py-2.5 text-sm text-zinc-200 outline-none">
            <!-- Populated dynamically via JS -->
          </select>
        </div>

        <!-- Background & Aspect Ratio -->
        <div class="grid grid-cols-2 gap-3">
          <div id="bgOptionWrapper">
            <label class="block text-xs font-medium text-zinc-400 mb-2">Latar Belakang</label>
            <select id="bgSelect" class="w-full bg-zinc-900 border border-zinc-700/80 focus:border-amber-500 rounded-xl px-3 py-2.5 text-sm text-zinc-200 outline-none">
              <option value="solid black background, isolated vector">Hitam Solid (Kaos Gelap)</option>
              <option value="pure white background, isolated vector">Putih Solid (Kaos Terang)</option>
              <option value="die-cut sticker with thick white border on dark background">Gaya Stiker (White Border)</option>
            </select>
          </div>
          <div id="ratioOptionWrapper">
            <label class="block text-xs font-medium text-zinc-400 mb-2">Rasio Aspek</label>
            <select id="ratioSelect" class="w-full bg-zinc-900 border border-zinc-700/80 focus:border-amber-500 rounded-xl px-3 py-2.5 text-sm text-zinc-200 outline
